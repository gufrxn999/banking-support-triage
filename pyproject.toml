[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "banking-triage"
version = "0.1.0"
description = "Intent triage and tool-calling API for banking support messages"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "datasets>=4.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "joblib>=1.4",
    "langgraph>=1.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "scikit-learn>=1.5",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
demo = [
    "streamlit>=1.40",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
